<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트립 정산 앱</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: sans-serif;
      background: #1a2332;
      color: white;
      text-align: center;
      padding: 15px;
    }
    h1 { font-size: 48px; }
    h2 { font-size: 40px; }
    label {
      display: block;
      font-size: 28px;
      margin: 15px 0 5px;
      color: #90caf9;
      text-align: left;
    }
    input, select {
      width: 94%;
      font-size: 32px;
      padding: 15px;
      border-radius: 10px;
      border: none;
      margin-bottom: 5px;
      background: white;
      color: black;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row .f1 { flex: 1 1 0; min-width: 0; }
    .row .f2 { flex: 2 1 0; min-width: 0; }
    .row .f0 { flex: 0 0 auto; }
    .row label { font-size: 20px; margin: 12px 0 3px; white-space: nowrap; }
    .row input, .row select {
      width: 100%;
      box-sizing: border-box;
      font-size: 26px;
      padding: 12px;
      margin-bottom: 0;
    }
    .row.tight label { font-size: 17px; }
    .row.tight input, .row.tight select {
      font-size: 22px;
      padding: 10px;
    }
    .row .btn {
      width: auto;
      margin: 0;
      padding: 12px 16px;
      font-size: 28px;
      white-space: nowrap;
    }
    .btn {
      display: block;
      width: 96%;
      margin: 20px auto;
      padding: 22px;
      font-size: 40px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 12px;
    }
    .calc { background: #2d5a2d; }
    .excel { background: #1b7a3d; font-size: 32px; padding: 16px; }
    #tripList, #expList { list-style: none; padding: 0; }
    #tripList li, #expList li {
      background: #2d3a4f;
      margin: 10px auto;
      padding: 15px;
      width: 96%;
      border-radius: 12px;
      font-size: 26px;
      text-align: left;
      line-height: 1.6;
    }
    .exp-box {
      background: #1b3a24;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    #total { font-size: 36px; color: #ffd54f; font-weight: bold; line-height: 1.8; }
    #calcMsg { font-size: 22px; color: #a5d6a7; margin: 5px 0; min-height: 28px; }
    #rateMsg { font-size: 22px; color: #90caf9; margin: 5px 0; min-height: 28px; }
    .net { color: #ffd54f; font-weight: bold; font-size: 30px; }
  </style>
</head>
<body>
  <h1>🚛 트립 정산</h1>

  <div class="row tight">
    <div class="f1">
      <label>트립번호</label>
      <input type="text" id="tripNum" placeholder="44000">
    </div>
    <div class="f1">
      <label>날짜</label>
      <input type="date" id="tripDate">
    </div>
    <div class="f1">
      <label>운임</label>
      <input type="number" id="rate" step="0.001" value="1.33">
    </div>
    <div class="f1">
      <label>FSC</label>
      <input type="number" id="fsc" step="0.001" placeholder="0.185">
    </div>
  </div>

  <div class="row">
    <div class="f1">
      <label>출발지</label>
      <input type="text" id="origin" value="Mississauga, ON">
    </div>
    <div class="f1">
      <label>도착지</label>
      <input type="text" id="dest" placeholder="도착지">
    </div>
    <div class="f0">
      <button class="btn calc" onclick="calcMiles()">📍</button>
    </div>
  </div>
  <p id="calcMsg"></p>

  <div class="row">
    <div class="f1">
      <label>마일수</label>
      <input type="number" id="miles" placeholder="자동 계산">
    </div>
    <div class="f1">
      <button class="btn" onclick="addTrip()">트립 추가</button>
    </div>
  </div>

  <h2>트립 목록</h2>
  <ul id="tripList"></ul>
  <p id="total"></p>

  <h2>⛽ 경비 입력</h2>
  <div class="exp-box">
    <div class="row tight">
      <div class="f1">
        <label>주유 날짜</label>
        <input type="date" id="expDate" onchange="fetchRate()">
      </div>
      <div class="f1">
        <label>국가</label>
        <select id="expCountry" onchange="updateExpLabels()">
          <option value="US">🇺🇸 미국</option>
          <option value="CA">🇨🇦 캐나다</option>
        </select>
      </div>
    </div>
    <div class="row tight">
      <div class="f1">
        <label>환율</label>
        <input type="number" id="xrate" step="0.0001" placeholder="자동">
      </div>
      <div class="f0">
        <button class="btn calc" onclick="fetchRate()">🔄</button>
      </div>
      <div class="f1">
        <label>종류</label>
        <select id="expType"><option>디젤</option><option>DEF</option></select>
      </div>
    </div>
    <p id="rateMsg"></p>
    <div class="row tight">
      <div class="f1">
        <label id="expQtyLabel">수량(갤런)</label>
        <input type="number" id="expQty" step="0.01">
      </div>
      <div class="f1">
        <label id="expPriceLabel">단가(USD)</label>
        <input type="number" id="expPrice" step="0.001">
      </div>
    </div>
    <button class="btn calc" onclick="addExpense()">경비 추가</button>
  </div>

  <h2>경비 목록</h2>
  <ul id="expList"></ul>

  <button class="btn excel" onclick="exportCSV()">📥 엑셀로 내보내기</button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let trips = [];
    let expenses = [];
    const GAL_TO_L = 3.78541;

    async function geocode(query) {
      let url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
        + encodeURIComponent(query);
      let res = await fetch(url);
      let data = await res.json();
      if (data.length === 0) throw 'not found';
      return { lat: data[0].lat, lon: data[0].lon };
    }

    async function routeMiles(o, d) {
      let url = 'https://router.project-osrm.org/route/v1/driving/'
        + o.lon + ',' + o.lat + ';' + d.lon + ',' + d.lat + '?overview=false';
      let res = await fetch(url);
      let data = await res.json();
      let meters = data.routes[0].distance;
      return meters / 1609.34;
    }

    async function calcMiles() {
      let origin = document.getElementById('origin').value;
      let dest = document.getElementById('dest').value;
      if (!origin || !dest) {
        alert('출발지와 도착지를 입력해줘');
        return;
      }
      document.getElementById('calcMsg').textContent = '계산 중...';
      try {
        let o = await geocode(origin);
        let d = await geocode(dest);
        let miles = await routeMiles(o, d);
        document.getElementById('miles').value = Math.round(miles);
        document.getElementById('calcMsg').textContent =
          '약 ' + Math.round(miles) + '마일 (일반 차량 경로 기준)';
      } catch (e) {
        document.getElementById('calcMsg').textContent = '';
        alert('마일 계산 실패. 지명을 다시 확인해줘');
      }
    }

    function addTrip() {
      let num = document.getElementById('tripNum').value.trim();
      let date = document.getElementById('tripDate').value;
      let origin = document.getElementById('origin').value;
      let dest = document.getElementById('dest').value;
      let miles = parseFloat(document.getElementById('miles').value);
      let rate = parseFloat(document.getElementById('rate').value);
      let fsc = parseFloat(document.getElementById('fsc').value) || 0;

      if (!num || !date || !origin || !dest || !miles || !rate) {
        alert('다 입력해줘');
        return;
      }

      let pay = miles * (rate + fsc);
      trips.push({num: num, date: date, origin: origin, dest: dest,
        miles: miles, rate: rate, fsc: fsc, pay: pay});
      render();

      document.getElementById('dest').value = '';
      document.getElementById('miles').value = '';
      document.getElementById('origin').value = dest;
      document.getElementById('calcMsg').textContent = '';
    }

    function updateExpLabels() {
      let c = document.getElementById('expCountry').value;
      document.getElementById('expQtyLabel').textContent =
        (c === 'US') ? '수량(갤런)' : '수량(리터)';
      document.getElementById('expPriceLabel').textContent =
        (c === 'US') ? '단가(USD)' : '단가(CAD)';
    }

    async function fetchRate() {
      let dateStr = document.getElementById('expDate').value;
      let msg = document.getElementById('rateMsg');
      if (!dateStr) {
        msg.textContent = '주유 날짜를 먼저 입력해줘';
        return;
      }
      msg.textContent = '환율 가져오는 중...';
      try {
        let res = await fetch('https://api.frankfurter.app/' + dateStr + '?from=USD&to=CAD');
        let data = await res.json();
        let rate = data.rates.CAD;
        document.getElementById('xrate').value = rate.toFixed(4);
        msg.textContent = (data.date === dateStr)
          ? dateStr + ' 환율 ' + rate.toFixed(4)
          : dateStr + '은 휴장일이라 ' + data.date + ' 환율 ' + rate.toFixed(4) + ' 적용';
      } catch (e) {
        msg.textContent = '자동 가져오기 실패 — 직접 입력해줘';
      }
    }

    function addExpense() {
      let tripNum = document.getElementById('tripNum').value.trim();
      if (!tripNum) {
        alert('맨 위에 트립번호를 입력해줘');
        return;
      }
      let expDate = document.getElementById('expDate').value;
      if (!expDate) {
        alert('주유 날짜를 입력해줘');
        return;
      }
      let type = document.getElementById('expType').value;
      let country = document.getElementById('expCountry').value;
      let qty = parseFloat(document.getElementById('expQty').value);
      let price = parseFloat(document.getElementById('expPrice').value);
      let xrate = parseFloat(document.getElementById('xrate').value) || 1;
      if (!qty || !price) {
        alert('수량과 단가를 입력해줘');
        return;
      }

      let liters, totalCAD;
      if (country === 'US') {
        liters = qty * GAL_TO_L;
        totalCAD = qty * price * xrate;
      } else {
        liters = qty;
        totalCAD = qty * price;
      }
      expenses.push({tripNum: tripNum, date: expDate, type: type, country: country,
        qty: qty, price: price, xrate: xrate, liters: liters, totalCAD: totalCAD});
      render();

      document.getElementById('expQty').value = '';
      document.getElementById('expPrice').value = '';
    }

    function render() {
      let ul = document.getElementById('tripList');
      ul.innerHTML = '';
      let totalPay = 0;

      trips.forEach(function(t) {
        totalPay += t.pay;
        let li = document.createElement('li');
        li.innerHTML =
          '<b>[' + t.num + '] ' + t.date + ': ' + t.origin + ' → ' + t.dest + '</b><br>' +
          t.miles + '마일 × (C$' + t.rate.toFixed(3) + ' + C$' + t.fsc.toFixed(3) + ')<br>' +
          '<span class="net">수익: C$' + t.pay.toFixed(2) + '</span>';
        ul.appendChild(li);
      });

      let totalExp = expenses.reduce(function(s, f) { return s + f.totalCAD; }, 0);
      let net = totalPay - totalExp;

      document.getElementById('total').innerHTML =
        (trips.length > 0 || expenses.length > 0)
          ? '수익 합계: C$' + totalPay.toFixed(2) +
            ' / 경비 합계: C$' + totalExp.toFixed(2) +
            '<br><span class="net">순수익: C$' + net.toFixed(2) + '</span>'
          : '';

      let el = document.getElementById('expList');
      el.innerHTML = '';
      expenses.forEach(function(f) {
        let unit = (f.country === 'US') ? '갤런' : '리터';
        let flag = (f.country === 'US') ? '🇺🇸' : '🇨🇦';
        let cur = (f.country === 'US') ? 'US$' : 'C$';
        let li = document.createElement('li');
        li.textContent = '[' + f.tripNum + '] ' + f.date + ' ' + f.type + ' ' + flag +
          ': ' + f.qty + unit + ' × ' + cur + f.price.toFixed(3) +
          ' = C$' + f.totalCAD.toFixed(2) +
          ' (' + Math.round(f.liters) + 'L, 환율 ' + f.xrate.toFixed(4) + ')';
        el.appendChild(li);
      });
    }

    function csvCell(v) {
      v = String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) {
        return '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    }

    function exportCSV() {
      if (trips.length === 0 && expenses.length === 0) {
        alert('내보낼 내용이 없어');
        return;
      }
      let totalPay = trips.reduce(function(s, t) { return s + t.pay; }, 0);
      let totalExp = expenses.reduce(function(s, f) { return s + f.totalCAD; }, 0);

      let rows = [];
      rows.push(['트립번호', '날짜', '출발지', '도착지', '마일',
        '기본운임(C$/mile)', 'FSC(C$/mile)', '수익(C$)']);
      trips.forEach(function(t) {
        rows.push([t.num, t.date, t.origin, t.dest, t.miles,
          t.rate.toFixed(3), t.fsc.toFixed(3), t.pay.toFixed(2)]);
      });
      rows.push([]);
      rows.push(['트립번호', '주유날짜', '연료종류', '국가', '수량', '단위',
        '단가', '통화', '적용환율', '리터(L)', '경비(C$)']);
      expenses.forEach(function(f) {
        rows.push([f.tripNum, f.date, f.type,
          (f.country === 'US') ? '미국' : '캐나다',
          f.qty,
          (f.country === 'US') ? '갤런' : '리터',
          f.price.toFixed(3),
          (f.country === 'US') ? 'USD' : 'CAD',
          f.xrate.toFixed(4),
          f.liters.toFixed(1),
          f.totalCAD.toFixed(2)]);
      });
      rows.push([]);
      rows.push(['수익 합계(C$)', totalPay.toFixed(2)]);
      rows.push(['경비 합계(C$)', totalExp.toFixed(2)]);
      rows.push(['순수익(C$)', (totalPay - totalExp).toFixed(2)]);

      let csv = '﻿' + rows.map(function(r) {
        return r.map(csvCell).join(',');
      }).join('\n');

      let blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      let today = new Date().toISOString().slice(0, 10);
      a.download = 'trips-' + today + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    (function() {
      let d = new Date();
      let today = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      document.getElementById('tripDate').value = today;
      document.getElementById('expDate').value = today;
      fetchRate();
    })();
    render();
  </script>
</body>
</html>
